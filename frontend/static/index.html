<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MedHub</title>
<link rel="icon" type="image/svg+xml" href="/static/akonaditray.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo">
        <svg class="logo-svg" width="22" height="22" viewBox="0 0.5 16 16" xmlns="http://www.w3.org/2000/svg">
          <path style="fill:#cddff0" d="m 15,9 c 0,3.865993 -3.608583,2.389831 -7.4745763,2.389831 C 3.6594305,11.389831 1,12.865993 1,9 1,5.1340068 4.1340068,2 8,2 c 3.865993,0 7,3.1340068 7,7 z"/>
          <path style="fill:#62b4e7" d="M 12.661989,14.047291 C 8.8361887,16.256291 4.2825718,15.724952 2.0729718,11.898952 -0.13592816,8.072252 1.1750518,3.2087 5.0013718,1 c 4.5084,-0.020828 7.3712002,8.2346249 8.0000002,12.369325 z"/>
          <path style="fill:#357dc5" d="m 16,8 c 0,4.418 -3.582,8 -8,8 C 3.5817,16 0,12.418 0,8 0.89231262,6.4379741 2.9996492,6.0097826 5.457785,6 9.1604662,5.9852645 13.659086,7.0846094 16,8 Z"/>
        </svg>
        <span class="logo-text">MedHub</span>
      </div>
      <div class="topbar-right">
        <button id="newChatBtn" class="new-chat-btn" type="button" title="Start a new chat">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>New Chat</span>
        </button>
        <div id="userProfile" class="user-profile" style="display: none;">
          <div class="user-badge">
            <span class="user-avatar">👤</span>
            <span id="userNameDisplay" class="user-name"></span>
          </div>
          <button id="logoutBtn" class="logout-btn" type="button" title="Log out">Logout</button>
        </div>
        <button id="loginPromptBtn" class="login-prompt-btn" type="button">Sign In</button>
      </div>
    </header>

    <main class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <h1 class="gradient-text">Hello, how can I help?</h1>
        <p class="subtitle">Ask me anything about your health, symptoms, or medications.</p>
      </div>
      <div class="messages" id="messages"></div>
    </main>

    <footer class="input-area">
      <div class="input-wrapper">
        <div class="input-bar">
          <button class="icon-btn" id="uploadBtn" title="Upload medical report or prescription (Image / PDF)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </button>
          <input type="file" id="fileInput" accept="image/*,.pdf" hidden>
          <textarea id="userInput" placeholder="Ask MedHub about symptoms, medications, or health schedules..." rows="1"></textarea>
          <button class="send-btn" id="sendBtn" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
          </button>
        </div>
      </div>
      <p class="disclaimer">MedHub can make mistakes. Consider checking important information with a doctor.</p>
    </footer>
  </div>

  <!-- Authentication Modal for Sign In / Sign Up -->
  <div id="authModal" class="auth-modal-overlay" style="display: none;">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg class="logo-svg" width="26" height="26" viewBox="0 0.5 16 16" xmlns="http://www.w3.org/2000/svg">
            <path style="fill:#cddff0" d="m 15,9 c 0,3.865993 -3.608583,2.389831 -7.4745763,2.389831 C 3.6594305,11.389831 1,12.865993 1,9 1,5.1340068 4.1340068,2 8,2 c 3.865993,0 7,3.1340068 7,7 z"/>
            <path style="fill:#62b4e7" d="M 12.661989,14.047291 C 8.8361887,16.256291 4.2825718,15.724952 2.0729718,11.898952 -0.13592816,8.072252 1.1750518,3.2087 5.0013718,1 c 4.5084,-0.020828 7.3712002,8.2346249 8.0000002,12.369325 z"/>
            <path style="fill:#357dc5" d="m 16,8 c 0,4.418 -3.582,8 -8,8 C 3.5817,16 0,12.418 0,8 0.89231262,6.4379741 2.9996492,6.0097826 5.457785,6 9.1604662,5.9852645 13.659086,7.0846094 16,8 Z"/>
          </svg>
          <span class="logo-text">MedHub</span>
        </div>
        <h2 id="authTitle">Sign In</h2>
        <p id="authSubtitle">Enter your username and password to continue</p>
      </div>

      <div class="auth-tabs">
        <button id="tabSignIn" class="auth-tab active" type="button">Sign In</button>
        <button id="tabSignUp" class="auth-tab" type="button">Sign Up</button>
      </div>

      <div id="authAlert" class="auth-alert" style="display: none;"></div>

      <form id="authForm" class="auth-form" onsubmit="return false;">
        <div class="form-group">
          <label for="authUsername">Username</label>
          <input type="text" id="authUsername" placeholder="e.g. siva" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="authSubmitBtn" class="auth-submit-btn">Sign In</button>
      </form>

      <div class="auth-switch">
        <span id="authSwitchText">Don't have an account?</span>
        <button id="authSwitchBtn" class="auth-switch-btn" type="button">Sign Up</button>
      </div>
    </div>
  </div>

<script src="/static/script.js"></script>
</body>
</html>
